version: 1
fields:
  title:
    type: string
    required: true
  type:
    type: string
    required: true
    enum:
      - person
      - discovery
      - media
      - subject
  position:
    type: string
  kontakt.email:
    type: string
  status:
    type: string
    enum:
      - identified
      - lead
      - zu_kontaktieren
migrations:
  - op: rename
    from: rolle
    to: position
  - op: rename
    from: kontakt_email
    to: kontakt.email
  - op: value_map
    field: status
    map:
      active: identified
  - op: set_default
    field: type
    value: person
  - op: unset_if_null
    field: legacy_note
