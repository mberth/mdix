[project]
name = "mdix"
version = "0.2.1"
description = "mdix is a command-line toolkit that keeps Markdown knowledge bases consistent, especially when humans and AI agents maintain them together."
readme = "README.md"
authors = [
    { name = "Matthias Berth", email = "kontakt@matthiasberth.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click",
    "python-frontmatter",
]

[project.scripts]
mdix = "mdix:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.1",
    "showboat>=0.6.1",
]

[tool.ruff]
line-length = 120
