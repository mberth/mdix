[project]
name = "mdix"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matthias Berth", email = "matthias@matthiasberth.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click",
    "python-frontmatter",
]

[project.scripts]
mdix = "mdix:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.1",
]

[tool.ruff]
line-length = 120
